server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS resolver (позволяет запускать/перезапускать микросервисы независимо без кэша старого IP)
    resolver 127.0.0.11 valid=10s;

    # Модуль 00 (Core): Авторизация и Управление платформой (/api/auth/...)
    location /api/auth/ {
        set $upstream_core http://crm_sync:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Модуль 00 (Core): Админка и настройки (/api/admin/...)
    location /api/admin/ {
        set $upstream_core http://crm_sync:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_core;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Модуль 02: Python Аналитика 2 (/api/py2/...)
    location /api/py2/ {
        set $upstream_py2 http://analytics_2:8001;
        rewrite ^/api/py2/(.*)$ /$1 break;
        proxy_pass $upstream_py2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Модуль 03: Python Аналитика 3 (/api/py3/...)
    location /api/py3/ {
        set $upstream_py3 http://analytics_3:8002;
        rewrite ^/api/py3/(.*)$ /$1 break;
        proxy_pass $upstream_py3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Модуль 01: Аналитика времени (/api/...)
    location /api/ {
        set $upstream_backend http://backend:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA routing (Единая панель)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
