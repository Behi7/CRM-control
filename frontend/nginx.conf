server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS resolver (позволяет запускать/перезапускать Python-модули независимо)
    resolver 127.0.0.11 valid=30s;

    # Модуль 02: Python Аналитика 2 (/api/py2/...)
    location /api/py2/ {
        set $upstream_py2 http://analytics_2:8001;
        rewrite ^/api/py2/(.*)$ /$1 break;
        proxy_pass $upstream_py2;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Модуль 03: Python Аналитика 3 (/api/py3/...)
    location /api/py3/ {
        set $upstream_py3 http://analytics_3:8002;
        rewrite ^/api/py3/(.*)$ /$1 break;
        proxy_pass $upstream_py3;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Модуль 01 (Ядро): Текущий backend аналитики времени (/api/...)
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # SPA routing (Единая панель)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
